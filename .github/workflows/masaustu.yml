name: "Masaüstü (Steam - Windows, macOS, Linux)"
# Electron kabuğu (desktop/) + oyun (www/). Çıktılar GitHub Releases'a "masaustu-<sürüm>" etiketiyle yüklenir.
# Derleme günlükleri "masaustu-gunluk" dalına yazılır (hata ayıklamak için).
on:
  workflow_dispatch:
    inputs:
      version_name: { description: "Sürüm (ör. 1.5.0)", required: true }
      steam_app_id: { description: "Steam App ID (bilinmiyorsa 0)", required: true, default: "0" }
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, cmd: dist:win, name: windows }
          - { os: macos-latest, cmd: dist:mac, name: macos }
          - { os: ubuntu-latest, cmd: dist:linux, name: linux }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Oyunu kabuğa kopyala
        run: |
          rm -rf desktop/www && cp -r www desktop/www && cp assets/icon-only.png desktop/www/icon.png
          echo '{ "appId": ${{ inputs.steam_app_id }} }' > desktop/steam.json
          cd desktop && npm pkg set version=${{ inputs.version_name }}
      - name: Derle
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: |
          set -o pipefail
          (npm install --no-audit --no-fund && npm run ${{ matrix.cmd }}) 2>&1 | tee ../gunluk-${{ matrix.name }}.txt
      - name: Çıktılar
        if: always()
        run: |
          ls -la desktop/dist >> gunluk-${{ matrix.name }}.txt 2>&1 || true
          mkdir -p cikti && cp desktop/dist/*.zip desktop/dist/*.tar.gz desktop/dist/*.AppImage desktop/dist/*.deb cikti/ 2>/dev/null || true
          ls -la cikti
      - uses: actions/upload-artifact@v4
        with: { name: "paket-${{ matrix.name }}", path: cikti/*, if-no-files-found: warn }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "gunluk-${{ matrix.name }}", path: "gunluk-${{ matrix.name }}.txt" }
  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: indir }
      - name: Günlükleri dala yaz
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          mkdir -p /tmp/g && cp indir/gunluk-*/*.txt /tmp/g/ 2>/dev/null || true
          git checkout --orphan masaustu-gunluk && git rm -rqf . && cp /tmp/g/*.txt . 2>/dev/null || true
          for f in gunluk-*.txt; do tail -c 60000 "$f" > "$f.k" && mv "$f.k" "$f"; done
          git add -A && git commit -qm "Günlük ${{ inputs.version_name }}" && git push -qf origin masaustu-gunluk || true
      - name: GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG=masaustu-${{ inputs.version_name }}
          ls -laR indir | grep -v gunluk || true
          gh release view $TAG -R ${{ github.repository }} >/dev/null 2>&1 || gh release create $TAG -R ${{ github.repository }} --title "Masaüstü ${{ inputs.version_name }}" --notes "Steam (Windows, macOS, Linux) ve Pardus paketleri" --prerelease --target ${{ github.sha }}
          for f in indir/paket-*/*; do gh release upload $TAG "$f" -R ${{ github.repository }} --clobber; done
