name: App Store ekran görüntüleri
# store/screenshots-ios/ içindeki iPhone ve iPad görüntülerini App Store Connect'e yükler (Türkçe sayfa).
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "App Store sürümü (ör. 1.0.0)"
        default: "1.0.0"
env:
  ASC_KEY_ID: DJSHKK6T3P
  ASC_ISSUER_ID: f4943ef8-df6f-42c8-a561-58554097ea35
jobs:
  deliver:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Görselleri hazırla
        run: |
          mkdir -p fastlane/screenshots/tr
          cp store/screenshots-ios/*.png fastlane/screenshots/tr/
          ls -la fastlane/screenshots/tr
      - name: App Store Connect anahtarı
        env: { P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: |
          python3 -c "import json,os; json.dump({'key_id':os.environ['ASC_KEY_ID'],'issuer_id':os.environ['ASC_ISSUER_ID'],'key':os.environ['P8'],'in_house':False}, open('api_key.json','w'))"
      - name: Yükle
        run: |
          fastlane deliver --api_key_path api_key.json --app_identifier com.anduv.malazgirt \
            --app_version "${{ inputs.version_name }}" --skip_binary_upload true --skip_metadata true \
            --screenshots_path fastlane/screenshots --overwrite_screenshots true \
            --force true --run_precheck_before_submit false --submit_for_review false
