name: App Store durum
# App Store Connect API anahtarıyla sürüm ve uygulama içi ürün durumunu okur, "durum" dalına asc.json yazar.
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  ASC_KEY_ID: DJSHKK6T3P
  ASC_ISSUER_ID: f4943ef8-df6f-42c8-a561-58554097ea35
jobs:
  durum:
    runs-on: ubuntu-latest
    steps:
      - name: Durumu oku
        env: { P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: |
          pip install -q pyjwt cryptography requests
          python3 - <<'PY'
          import jwt, time, os, json, requests
          tok = jwt.encode({'iss': os.environ['ASC_ISSUER_ID'], 'iat': int(time.time()), 'exp': int(time.time()) + 600, 'aud': 'appstoreconnect-v1'},
                           os.environ['P8'], algorithm='ES256', headers={'kid': os.environ['ASC_KEY_ID']})
          H = {'Authorization': 'Bearer ' + tok}
          B = 'https://api.appstoreconnect.apple.com'
          out = {'zaman': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())}
          v = requests.get(B + '/v1/apps/6822718671/appStoreVersions?limit=3&fields[appStoreVersions]=versionString,appStoreState', headers=H).json()
          out['surumler'] = [[d['attributes']['versionString'], d['attributes']['appStoreState']] for d in v.get('data', [])] or v
          i = requests.get(B + '/v2/inAppPurchases/6826821590', headers=H).json()
          out['urun'] = i.get('data', {}).get('attributes', {}).get('state', i)
          r = requests.get(B + '/v1/apps/6822718671/reviewSubmissions?limit=2&fields[reviewSubmissions]=state,submittedDate', headers=H).json()
          out['inceleme'] = [[d['attributes'].get('state'), d['attributes'].get('submittedDate')] for d in r.get('data', [])] or r
          json.dump(out, open('asc.json', 'w'), ensure_ascii=False, indent=1)
          print(json.dumps(out, ensure_ascii=False))
          PY
      - name: Dala yaz
        run: |
          git init -q d && cd d && cp ../asc.json . && git add asc.json
          git -c user.name=gha -c user.email=gha@x commit -qm durum
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:durum
